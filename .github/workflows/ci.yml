# Continuous integration for the Mini Kanban monorepo.
#
# Three jobs, matching the three things that can independently break:
#   backend  — lint, types, 67 unit tests, and the e2e suite against a real
#              Postgres (the guard chain, the 409 conflict path and the move
#              API are only meaningfully testable against a live database)
#   frontend — lint, types, the pure-logic unit tests, and a production build
#   docker   — root ROADMAP.md Phase 3/6's acceptance test: a fresh checkout
#              must come up with `cp .env.example .env && docker compose up
#              --build` and serve both apps with zero manual steps
#
# The docker job is the one that matters most on a submission repo: it is the
# only check that exercises what a reviewer actually runs first.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-kanban-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban_test
        ports: ["5432:5432"]
        # Without this the job races the container and the first Prisma
        # command fails on a database that isn't accepting connections yet.
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban_test?schema=public
      # CI-only values. They must differ from each other — the app refuses to
      # boot in production when they match, since that would make the
      # refresh-token HMAC key double as the access-token signing key.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-refresh-secret-distinct-from-access
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mini-kanban-backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        # `migrate deploy`, never `db push` — CI replays the committed
        # migrations so a broken or missing one fails here rather than on a
        # deploy.
        run: npx prisma migrate deploy

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-kanban-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mini-kanban-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # BACKEND_URL is baked into the rewrite at build time (next.config.mjs),
        # so it is supplied here for the same reason the Dockerfile takes it as
        # an ARG — a build with it unset only warns, which would let a
        # misconfigured image through.
        env:
          BACKEND_URL: http://backend:4000
        run: npm run build

  docker:
    name: Docker bring-up
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bring the whole stack up from a fresh checkout
        # Exactly the two commands README.md's Quick start gives a reviewer.
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Wait for the backend to answer its health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/v1/health | grep -q '"ok"'; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy"
          docker compose logs --no-color
          exit 1

      - name: Wait for the frontend, and prove the same-origin proxy works
        run: |
          for i in $(seq 1 60); do
            # Not just the frontend's own port: /api/v1 has to reach the
            # backend *through* the Next rewrite, which is what catches a
            # BACKEND_URL baked at the wrong value (the failure mode
            # docker-compose.yml's build-arg comment describes).
            if curl -fsS http://localhost:3000/api/v1/health | grep -q '"ok"'; then
              echo "frontend proxy healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "frontend proxy never became healthy"
          docker compose logs --no-color
          exit 1

      - name: Seed, then register and log in over the proxy
        # The end-to-end path a reviewer takes on first contact: cookies must
        # survive the rewrite, and the CSRF header guard must reject a
        # mutation sent without X-Requested-With.
        run: |
          docker compose exec -T backend npm run db:seed
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -H 'X-Requested-With: mini-kanban' \
            -d '{"email":"demo@example.com","password":"DemoPass123!"}')
          test "$code" = "200" || { echo "login returned $code"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.com","password":"DemoPass123!"}')
          test "$code" = "403" || { echo "CSRF guard let a headerless POST through ($code)"; exit 1; }

      - name: Tear down
        if: always()
        run: docker compose down -v
