# Root ROADMAP.md Phase 3 — one-command bring-up: `cp .env.example .env && docker compose up --build`
# starts db + backend + frontend with zero further manual steps.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./mini-kanban-backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["4000:4000"]

  frontend:
    # BACKEND_URL must arrive as a BUILD ARG, not only through env_file — Next bakes
    # the /api/v1 rewrite destination into routes-manifest.json at build time and
    # never re-reads it at run time (frontend ROADMAP Phase 2 / Phase 12). Without
    # this, the image bakes http://localhost:4000 and every API call in the
    # container 502s.
    build:
      context: ./mini-kanban-frontend
      args:
        BACKEND_URL: ${BACKEND_URL}
    env_file: .env
    # PORT=4000 in root .env is the backend's (ROADMAP Phase 13). Both services
    # share one env_file, and Next's standalone server honours process.env.PORT
    # — without this override the frontend container silently listens on 4000
    # too, so container port 3000 has nothing on it and the 3000:3000 mapping
    # below is dead. Found live: `docker logs` showed the frontend's own
    # "Local: http://<host>:4000" instead of :3000. A service-level
    # `environment:` entry wins over env_file, which is why this fixes it.
    environment:
      PORT: 3000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
